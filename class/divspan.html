<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签类型</title>
    <style>
            .top{
                height: 80px;
                background-color:white;
                margin:10 auto;
            }
            #nav{
                width: 270px;
                height: 129px;
                background-color:white;
                margin:0 auto;
            }
            .nav_top{
                font-size:15px;
                color:#222;
                font-family: 微软雅黑;
                padding-left: 20px;
                line-height: 10px;
            }
            #nav img{
                width:270px;
                height:100px;
            }
            .nav_top a{
                text-decoration: none;
            }
            .nav_top a:link{
                color:#222;
            }
            .nav_top a:hover{
                color:rgb(5, 105, 145);
                text-decoration:underline;
            }
            .nav_top a:visited{
                color:#222
            }
            .form{
                width :680px;
                height:80px;
                border:1px solid blue;
                margin: 15px auto 5px auto;
            }
            .main{
                width:1200px;
                height:900px;
                border: 2px solid brown;
                margin :0 auto;
            }
    </style>
</head>
<body>
    <div class="top">
        <span class="nav_top"> <a href="https://news.baidu.com/" target="_blank">新闻</a> </span>
        <span class="nav_top"> <a href="https://www.hao123.com/?src=from_pc" target="_blank">hao123</a></span>
        <span class="nav_top"> <a href="https://map.baidu.com/" target="_blank">地图</a></span>
        <span class="nav_top"> <a href="https://tieba.baidu.com/" target="_blank">贴吧</a></span>
        <span class="nav_top"> <a href="https://haokan.baidu.com/?sfrom=baidu-top" target="_blank">视频</a></span>
        <span class="nav_top"> <a href="https://image.baidu.com/" target="_blank">图片</a></span>
        <span class="nav_top"> <a href="https://pan.baidu.com/?from=1026962h" target="_blank">网盘</a></span>
        <span class="nav_top"> <a href="https://kuku.baidu.com/" target="_blank">库库ai</a></span>
        <span class="nav_top"> <a href="https://wenxin.baidu.com/" target="_blank">文心</a></span>
    </div>
    <div id="nav"> 
        <img src="../img/百度logo.png">
    </div>
    <div class="form">
            百度一下，你就知道
    </div>
     <div class="main">
            百度一下，你就知道
    </div>
</body>
</html>
