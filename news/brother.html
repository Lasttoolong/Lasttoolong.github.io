<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>派生选择器</title>
    <style>
        h2~p{
            color :brown
        }
    </style>
</head>
<body>
    <h1>相邻兄弟选择器</h1>
    <p>是一个相邻的兄弟元素</p>
    <h2>另一个标题</h2>
    <p>是一个相邻的兄弟元素</p>
    <h3>另一个标题</h3>
    <p>是一个相邻的兄弟元素</p>
    <p>不是相邻的兄弟元素</p>
    <div>
        <p>div内部，与h1,h2,h3不是同一个父元素</p>
    </div>
</body>
</html>
